<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mengalihkan...</title>
<meta name="robots" content="noindex, follow">
<script>
  // Redirect otomatis dari post.html?slug=xxx ke /artikel/xxx/
  const urlParams = new URLSearchParams(window.location.search);
  const slug = urlParams.get('slug');
  if (slug) {
    // Ganti '/soe/' dengan nama repo Anda jika berbeda
    window.location.replace(`/soe/artikel/${slug}/`);
  } else {
    window.location.replace(`/soe/`);
  }
</script>
</head>
<footer class="site-footer">
  <div class="container-blog flex flex-col items-center gap-2">
    <p>&copy; <span id="year"></span> Blog Soe.</p>
    <div class="flex gap-4 text-xs">
      <a href="page.html?slug=about" class="hover:text-accent">About</a>
      <a href="page.html?slug=contact" class="hover:text-accent">Contact</a>
      <a href="page.html?slug=privacy-policy" class="hover:text-accent">Privacy</a>
      <a href="page.html?slug=disclaimer" class="hover:text-accent">Disclaimer</a>
    </div>
  </div>
</footer>
<body>
<p>Mengalihkan ke halaman artikel... <a id="link" href="/soe/">Klik di sini jika tidak teralihkan</a>.</p>
<script>
  const s = new URLSearchParams(window.location.search).get('slug');
  if(s) document.getElementById('link').href = `/soe/artikel/${s}/`;
</script>
</body>
</html>
