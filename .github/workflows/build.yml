name: Build Tailwind CSS

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/*.js'
      - 'src/input.css'
      - 'tailwind.config.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Tailwind
        run: npm run build

      - name: Commit CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/style.css
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: build tailwind css [skip ci]"
            git push
          fi