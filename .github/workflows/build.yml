name: Build Tailwind CSS

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/*.js'
      - 'src/input.css'
      - 'tailwind.config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Build Tailwind
        run: npm run build

      - name: Commit & push CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/style.css
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: build tailwind css [skip ci]"
          git push