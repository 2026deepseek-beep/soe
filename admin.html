<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin CMS — Blog Soe</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="container-blog flex justify-between items-center py-3.5" style="max-width:72rem">
    <a href="./" class="logo">📝 Blog Soe</a>
    <nav><a href="./" class="nav-link">← Lihat Blog</a></nav>
  </div>
</header>
<main class="admin-container">
  <h1 class="text-3xl font-bold mb-2">🛠️ CMS Admin <span class="ai-badge">AI SEO Ready</span></h1>
  <p class="text-slate-500 dark:text-slate-400 text-sm mb-5">Tulis artikel pakai Markdown. Sistem otomatis generate JSON, FAQ Schema, HowTo Schema.</p>
  <div class="tabs">
    <button class="tab active" data-panel="editor">✍️ Editor</button>
    <button class="tab" data-panel="meta">🔍 SEO Meta</button>
    <button class="tab" data-panel="output">📦 Output JSON</button>
  </div>
  <div class="panel active" id="panel-editor">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div>
        <div class="toolbar">
          <button type="button" onclick="wrap('**','**')"><b>B</b></button>
          <button type="button" onclick="wrap('*','*')"><i>I</i></button>
          <button type="button" onclick="prefix('## ')">H2</button>
          <button type="button" onclick="prefix('- ')">• List</button>
          <button type="button" onclick="prefix('> ')">❝ Quote</button>
        </div>
        <textarea id="content" class="form-textarea" placeholder="# Judul Artikel&#10;&#10;Tulis konten...&#10;&#10;## Apa itu SEO AI?&#10;Jawaban singkat..." oninput="renderPreview(); updateStats()"></textarea>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
          <div class="stat"><b id="stat-words">0</b><span>Kata</span></div>
          <div class="stat"><b id="stat-read">0</b><span>Menit</span></div>
          <div class="stat"><b id="stat-faq">0</b><span>FAQ</span></div>
          <div class="stat"><b id="stat-steps">0</b><span>Steps</span></div>
        </div>
      </div>
      <div>
        <label class="form-label">👁️ Preview</label>
        <div class="preview article-content" id="preview"><p class="text-slate-500">Preview muncul di sini...</p></div>
      </div>
    </div>
  </div>
  <div class="panel" id="panel-meta">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div>
        <div class="mb-4"><label class="form-label">Slug URL</label><input id="slug" class="form-input" placeholder="tutorial-seo-2026"></div>
        <div class="mb-4"><label class="form-label">Judul</label><input id="title" class="form-input" placeholder="Judul artikel"></div>
        <div class="mb-4"><label class="form-label">Meta Description (120-160 char)</label><textarea id="description" class="form-textarea-sm" placeholder="Deskripsi SEO..."></textarea></div>
        <div class="mb-4"><label class="form-label">AI Summary</label><textarea id="aiSummary" class="form-textarea-sm" placeholder="Ringkasan 1-2 kalimat untuk AI..."></textarea></div>
      </div>
      <div>
        <div class="mb-4"><label class="form-label">Tanggal</label><input id="date" type="date" class="form-input"></div>
        <div class="mb-4"><label class="form-label">Penulis</label><input id="author" class="form-input" value="Admin"></div>
        <div class="mb-4"><label class="form-label">Tags (pisah koma)</label><input id="tags" class="form-input" placeholder="seo, tutorial"></div>
        <div class="mb-4"><label class="form-label">Kategori</label><input id="category" class="form-input" value="Tutorial"></div>
      </div>
    </div>
  </div>
  <div class="panel" id="panel-output">
    <div class="flex flex-wrap gap-2.5 mb-4">
      <button class="btn" onclick="generatePost()">⚡ Generate JSON Artikel</button>
      <button class="btn btn-ghost" onclick="generateManifest()">📋 Update index.json</button>
      <button class="btn btn-ghost" onclick="generateLLMsTxt()">🤖 Generate llms.txt</button>
    </div>
    <div id="output" class="output" hidden></div>
  </div>
</main>
<script src="assets/markdown.js"></script>
<script src="assets/ai-seo.js"></script>
<script>
const $ = id => document.getElementById(id);
$('date').valueAsDate = new Date();
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab, .panel').forEach(el => el.classList.remove('active'));
    tab.classList.add('active');
    $('panel-' + tab.dataset.panel).classList.add('active');
  });
});
function wrap(before, after) {
  const ta = $('content'), s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e) || 'teks';
  ta.value = ta.value.slice(0, s) + before + sel + after + ta.value.slice(e);
  ta.focus(); ta.setSelectionRange(s + before.length, s + before.length + sel.length);
  renderPreview(); updateStats();
}
function prefix(p) {
  const ta = $('content'), s = ta.selectionStart;
  const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1;
  ta.value = ta.value.slice(0, lineStart) + p + ta.value.slice(lineStart);
  ta.focus(); renderPreview(); updateStats();
}
function renderPreview() {
  $('preview').innerHTML = MD.parse($('content').value) || '<p class="text-slate-500">Preview muncul di sini...</p>';
}
function updateStats() {
  const md = $('content').value;
  $('stat-words').textContent = AISEO.stripMd(md).split(/\s+/).filter(Boolean).length;
  $('stat-read').textContent = AISEO.readingTime(md);
  $('stat-faq').textContent = AISEO.extractFAQs(md).length;
  $('stat-steps').textContent = (AISEO.extractSteps(md) || []).length;
}
function showOutput(label, content) {
  const out = $('output'); out.hidden = false;
  out.textContent = `// ${label}\n\n${content}`;
  if (!out.querySelector('.copy-btn')) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-ghost copy-btn'; btn.textContent = '📋 Copy';
    btn.onclick = () => { navigator.clipboard.writeText(out.textContent.replace(/^\/\/.*\n\n/, '')); btn.textContent = '✅ Copied!'; setTimeout(() => btn.textContent = '📋 Copy', 1500); };
    out.appendChild(btn);
  }
}
function gather() {
  const md = $('content').value;
  return {
    slug: $('slug').value || 'untitled', title: $('title').value || 'Tanpa Judul', description: $('description').value,
    aiSummary: $('aiSummary').value || AISEO.summary(md), date: $('date').value, updated: $('date').value,
    author: $('author').value, tags: $('tags').value.split(',').map(t => t.trim()).filter(Boolean),
    category: $('category').value, lang: 'id-ID', content: md,
    faqs: AISEO.extractFAQs(md), steps: AISEO.extractSteps(md),
    readingTime: AISEO.readingTime(md), wordCount: AISEO.stripMd(md).split(/\s+/).filter(Boolean).length
  };
}
function generatePost() { showOutput(`Simpan sebagai: posts/${gather().slug}.json`, JSON.stringify(gather(), null, 2)); }
function generateManifest() { const p = gather(); showOutput('Update posts/index.json', JSON.stringify({ slug: p.slug, title: p.title, description: p.description, aiSummary: p.aiSummary, date: p.date, author: p.author, tags: p.tags, category: p.category, readingTime: p.readingTime }, null, 2)); }
function generateLLMsTxt() { const p = gather(); showOutput('Tambahkan ke llms.txt', `- [${p.title}](https://2026deepsoe.github.io/soe/post.html?slug=${p.slug}): ${p.aiSummary}\n`); }
</script>
</body>
</html>
